name: 发布 Android Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: 检出标签源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 校验标签和发布说明
        id: version
        run: python3 tools/ci-release.py prepare --tag "$RELEASE_TAG"

      - name: 配置 Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: 安装 Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'

      - name: 恢复专用发行证书
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNER_SHA256: ${{ secrets.ANDROID_SIGNER_SHA256 }}
        run: |
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          for name in ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD', 'SIGNER_SHA256'):
              if not os.environ.get(name):
                  raise SystemExit(f'缺少发行配置：{name}')
          if not re.fullmatch(r'[0-9a-fA-F]{64}', os.environ['SIGNER_SHA256']):
              raise SystemExit('签名摘要格式错误')
          path = Path(os.environ['RUNNER_TEMP']) / 'picomic-release.p12'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'PICOMIC_KEYSTORE_FILE={path}\n')
          PY

      - name: 测试并构建三种架构的签名 Release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PICOMIC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PICOMIC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PICOMIC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 tools/test_ci_release.py
          bash ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            -PreleaseVersionName="$RELEASE_VERSION" -PreleaseAbiSplits=true \
            -PreleaseOwner="$GITHUB_REPOSITORY_OWNER" -PreleaseRepo="${GITHUB_REPOSITORY#*/}" \
            --no-daemon --console=plain

      - name: 从最终 APK 生成更新清单
        shell: pwsh
        env:
          SIGNER_SHA256: ${{ secrets.ANDROID_SIGNER_SHA256 }}
        run: |
          $apks = @('arm64-v8a', 'armeabi-v7a', 'x86_64') | ForEach-Object { "app/build/outputs/apk/release/app-$_-release.apk" }
          ./tools/prepare-release.ps1 -Apk $apks -ExpectedSignerSha256 $env:SIGNER_SHA256 -SdkRoot $env:ANDROID_HOME

      - name: 校验发布资产
        run: python3 tools/ci-release.py validate --tag "$RELEASE_TAG"

      - name: 创建草稿、上传并读回后发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci-release.py publish --tag "$RELEASE_TAG"

      - name: 保存构建验证记录
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.ref_name }}
          path: |
            artifacts/release/verification.json
            app/build/reports/lint-results-release.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: 清理临时证书
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'picomic-release.p12').unlink(missing_ok=True)
          PY
